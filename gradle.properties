org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Configuración de la app de taxistas ---
# apiMode: qué backend usa la app
#   mock     = backend simulado dentro de la app (no necesita servidor)
#   mvp      = backend actual de Joaquín (rutas /usuarios y /viaje, sin login con contraseña)
#   contract = backend completo según API_CONTRACT.md
apiMode=mvp
# URL del backend (la / final es obligatoria). Con ngrok cambia cada vez que Joaquín lo reinicia.
# Emulador contra tu propio PC: http://10.0.2.2:8080/
apiBaseUrl=https://jazz-raffle-linoleum.ngrok-free.dev/
